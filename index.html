<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confucius LMS | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Light/Dark Mode">
        <span id="theme-icon">☀️</span>
    </button>
    
    <!-- Mobile Header -->
    <div class="mobile-header">
        <button id="mobile-menu-btn" class="icon-btn">☰</button>
        <div class="mobile-brand">Confucius LMS</div>
        <div style="width: 24px;"></div> <!-- Spacer for flex balance -->
    </div>
    
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Global Sidebar -->
    <aside class="sidebar">
        <div class="brand">Confucius LMS</div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item active">Dashboard</a>
            <a href="catalog.html" class="nav-item">Course Catalog</a>
            <a href="my-courses.html" class="nav-item">My Courses</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="app-content">
        <div class="container">
            <header class="page-header">
                <h1>Welcome Back!</h1>
                <p>Here's an overview of your learning progress.</p>
            </header>

            <div class="metric-grid" id="dashboard-metrics">
                <div class="metric-card">
                    <div class="metric-label">Enrolled Courses</div>
                    <div class="metric-value" id="metric-enrolled">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Completed Lessons</div>
                    <div class="metric-value" id="metric-completed">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Learning Streak</div>
                    <div class="metric-value" id="metric-streak">3 Days</div>
                </div>
            </div>

            <div class="dashboard-section" style="margin-top: 3rem;">
                <h2 style="margin-bottom: 1.5rem; color: var(--text-primary);">Resume Learning</h2>
                <div id="recent-activity-container">
                    <!-- Populated by app.js -->
                    <p style="color: var(--text-secondary);">You have no active courses right now.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
