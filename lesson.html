<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confucius LMS | Lesson</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Light/Dark Mode">
        <span id="theme-icon">☀️</span>
    </button>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button id="mobile-menu-btn" class="icon-btn">☰</button>
        <div class="mobile-brand">Confucius LMS</div>
        <button id="mobile-curriculum-btn" class="icon-btn">📚</button>
    </div>
    
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Global Sidebar -->
    <aside class="sidebar">
        <div class="brand">Confucius LMS</div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item">Dashboard</a>
            <a href="my-courses.html" class="nav-item">My Courses</a>
        </nav>
    </aside>

    <!-- Lesson Layout -->
    <div class="lesson-layout">
        
        <!-- Curriculum Sidebar -->
        <aside class="curriculum-sidebar" id="curriculum-sidebar">
            <div class="curriculum-header">
                <h2 id="course-title-sidebar">Loading...</h2>
                <p>Course Curriculum</p>
            </div>
            <div class="curriculum-list" id="curriculum-list">
                <!-- Injected by app.js -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="lesson-main-area">
            <div class="lesson-content-wrapper">
                <div id="loading" style="text-align: center; color: var(--text-secondary);">Loading lesson data...</div>
                
                <h1 id="lesson-title" class="lesson-title hidden"></h1>
                <div id="lesson-blocks"></div>
                
                <!-- Next / Previous Navigation -->
                <div class="lesson-navigation" id="lesson-navigation" style="display: none;">
                    <button id="btn-prev-lesson" class="btn btn-outline">← Previous</button>
                    <button id="btn-next-lesson" class="btn btn-primary">Next →</button>
                </div>
            </div>
        </main>
        
    </div>

    <script src="js/app.js"></script>
</body>
</html>
